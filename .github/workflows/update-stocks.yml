name: Update US stock screener data

on:
  schedule:
    - cron: '41 22 * * 1-5'   # weekdays after the US close (06:41 Taiwan time the next morning)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-stocks
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch fundamentals and returns
        run: |
          pip install --quiet yfinance
          python scripts/build_stocks.py --workers 4
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add data/stocks.json
          if git diff --cached --quiet; then echo "No data changes"; exit 0; fi
          git commit -m "Update US stock data $(TZ=Asia/Taipei date +%F)"
          # the dental job may have pushed meanwhile
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
