name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # the data job pushes with GITHUB_TOKEN, which does not fire "push": redeploy when it finishes instead
  workflow_run:
    workflows: ["Update US stock screener data"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Prepare site (redirect only; the database lives at dental.top-geng.com behind ERP login, hosted on Vercel)
        run: |
          mkdir -p _site
          for f in index.html 404.html; do cat > _site/$f <<'HTML'
          <!doctype html><html lang="zh-Hant"><head><meta charset="utf-8">
          <meta name="robots" content="noindex,nofollow">
          <meta http-equiv="refresh" content="0; url=https://dental.top-geng.com/">
          <title>牙醫資料庫已移到 ERP</title></head>
          <body><p>牙醫資料庫已移到 ERP，請登入使用：<a href="https://dental.top-geng.com/">https://dental.top-geng.com/</a></p></body></html>
          HTML
          done
          touch _site/.nojekyll
      - name: US stock screener at /stocks/ (public market data only; holdings stay in each browser)
        run: |
          mkdir -p _site/stocks/data
          cp stocks.html _site/stocks/index.html
          for f in stocks.json news.json; do if [ -f data/$f ]; then cp data/$f _site/stocks/data/; fi; done
          ls -la _site/stocks _site/stocks/data
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
