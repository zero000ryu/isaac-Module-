name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Prepare site (redirect only; the database now lives in the ERP behind login)
        run: |
          mkdir -p _site
          for f in index.html 404.html; do cat > _site/$f <<'HTML'
          <!doctype html><html lang="zh-Hant"><head><meta charset="utf-8">
          <meta name="robots" content="noindex,nofollow">
          <meta http-equiv="refresh" content="0; url=https://erp.top-geng.com/dental/">
          <title>牙醫資料庫已移到 ERP</title></head>
          <body><p>牙醫資料庫已移到 ERP，請登入使用：<a href="https://erp.top-geng.com/dental/">https://erp.top-geng.com/dental/</a></p></body></html>
          HTML
          done
          echo "dental.top-geng.com" > _site/CNAME
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
